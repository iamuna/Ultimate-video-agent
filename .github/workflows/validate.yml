name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q video_agent vidgoclip shorts_factory app.py
      - name: Repository contract tests
        run: python -m unittest discover -s tests -p "test_structure.py" -v
